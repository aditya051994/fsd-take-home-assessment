version: '3.8'

services:
  event-sync-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-sync-service
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - event-sync-network

networks:
  event-sync-network:
    driver: bridge
